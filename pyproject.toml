[project]
name = "dedup-tui"
version = "0.6.3"
description = "Cross-platform interactive duplicate-file finder with a TUI; keeps the most original copy."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["textual>=0.80"]

[project.scripts]
dedup-tui = "dedup_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dedup_tui"]
